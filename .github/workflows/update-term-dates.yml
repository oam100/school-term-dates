name: Update term dates

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # One school failing (e.g. its data no longer reaches 9 months ahead)
      # mustn't block the others: each school that succeeds is still
      # committed, and the job is failed at the end if any school failed.
      - name: Refresh each school's term dates
        id: refresh
        run: |
          failed=""
          for school_dir in schools/*/; do
            school_dir="${school_dir%/}"
            echo "== ${school_dir} =="
            if python "${school_dir}/term_dates.py" -o "${school_dir}/term_dates.json" \
              && python scripts/ics_export.py -i "${school_dir}/term_dates.json" -o "${school_dir}/term_dates.ics"; then
              :
            else
              echo "::error::${school_dir} failed - keeping its last published feed"
              git checkout -- "${school_dir}"
              failed="${failed} ${school_dir}"
            fi
          done
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schools/*/term_dates.json schools/*/term_dates.ics
          # Gate on the JSON diff only: the ICS file's DTSTAMP changes every
          # run even when the underlying term data hasn't, so diffing the
          # ICS too would cause a commit every single run regardless.
          if git diff --cached --quiet -- schools/*/term_dates.json; then
            echo "No changes to term data - skipping commit"
          else
            git commit -m "Update term dates ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail if any school failed
        if: steps.refresh.outputs.failed != ''
        run: |
          echo "::error::Failed schools:${{ steps.refresh.outputs.failed }}"
          exit 1
